        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
      
      
body {
  font-family: 'Montserrat', sans-serif;
}      * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background-color: rgb(255, 255, 255);
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: static;
    width: 100%;
    height: 50px;
    background-color: rgb(107, 200, 211);
    color: aliceblue;
    padding: 1px 10px;
}

.navigation div {
    display: flex;
    align-items: center;
    gap: 10px;
}

.navigation div img {
    width: 50px;
    border-radius: 50%;
}

.nav a {
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    text-decoration: none;
    color: black;
    font-size: 17px;
    padding: 8px 12px;
    border-radius: 5px;
    transition: all 0.5s ease;
}

.nav a:hover {
    text-decoration: underline;
    width: 60px;
    font-size: 18px;
    transition: 0.5s;
}

.items {
    margin-top: 7rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 0 20px 7rem;
}

.item {
    text-align: center;
    font-size: 25px;
}

.item > img {
    width: 100%;
    height: auto;
    border-radius: 7px;
    transition: transform 0.5s;
}

.item > img:hover {
    transform: scale(1.05);
}

.item > a {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 14px;
    font-size: 14px;
    color: rgb(24, 25, 26);
    background-color: rgb(99, 204, 243);
    border-radius: 5px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.item > a:hover {
    background-image: linear-gradient(rgb(33, 49, 50), rgb(14, 14, 13));
    color: #f2f4fa;
    font-size: 15px;
    transform: scale(1.05);
}

/* Mobile View////////////////////////////////////////////////////////////////////////////////////////////////////// */
@media (max-width: 768px) {
    .items {
        grid-template-columns: repeat(2, 1fr);
    }
}


           </style> 
</head>
