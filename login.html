<!DOCTYPE html>
<html>



<head>
    <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
      
      
      body {
        font-family: 'Montserrat', sans-serif;
      }  
            * {
              padding: 0;
              margin: 0;
              box-sizing: border-box;
            }
        
            html, body {
              height: 100%;
              background-color: rgb(255, 255, 255);
              font-family: Arial, sans-serif;
            }
        
            .navigation {
              display: flex;
              justify-content: space-between;
              align-items: center;
              width: 100%;
              height: 50px;
              background-color: rgb(107, 200, 211);
              color: aliceblue;
              padding: 0 10px;
            }
        
            .navigation div {
              display: flex;
              align-items: center;
              gap: 10px;
            }
        
            .navigation img {
              width: 50px;
              border-radius: 50%;
            }
        
            .nav a {
              text-decoration: none;
              color: black;
              font-size: 17px;
              padding: 8px 12px;
              border-radius: 5px;
              transition: 0.3s ease;
            }
        
            .nav a:hover {
              text-decoration: underline;
              color: rgb(21, 26, 31);
            }
        
            .login {
              background-color: rgb(128, 223, 223);
              border: 1px solid rgb(107, 99, 99);
              border-radius: 7px;
              box-shadow: 4px 4px rgb(133, 132, 132);
              margin: 80px auto 60px auto;
              padding: 30px 20px;
              max-width: 400px;
              width: 90%;
              text-align: center;
            }
        
            .login h2 {
              font-size: 28px;
              margin-bottom: 25px;
            }
        
            .form {
              display: flex;
              flex-direction: column;
              gap: 15px;
              align-items: center;
            }
        
            .form input {
              width: 100%;
              padding: 10px;
              border-radius: 5px;
              border: 1px solid #ccc;
            }
        
            .form button {
              margin-top: 20px;
              padding: 10px;
              width: 100%;
              border-radius: 7px;
              background-color: rgb(107, 200, 211);
              color: white;
              border: none;
              font-size: 16px;
              cursor: pointer;
              transition: 0.3s ease;
            }
        
            .form button:hover {
              transform: scale(1.05);
              background-color: rgb(54, 48, 48);
            }
        
            .login p {
              margin-top: 20px;
            }
        
            .login a {
              color: blue;
              transition: 0.3s ease;
              text-decoration: none;
            }
        
            .login a:hover {
              color: rgb(60, 60, 190);
            }
        
            @media (max-width: 600px) {
              .login {
                margin: 50px 20px;
                padding: 25px 15px;
              }
            }
          </style>
</head>


<body>
    <header class="navigation">

        <div class="title">
            <img src="/photos/wallhaven-gjw8le_1280x1024 copy.png">
            <h1 >Clonepics</h1> 

        </div>               
        <nav class="nav">
            <a href="index.html" class="login-btn">Home</a>
        </nav>
    </header>
    
   <div class="login">
    
       <h2>Sign-in</h2>
       <form class="form" method="get" action="index.html">
           Username:<input type="text" id="uname" value="" required><br>
           Password:<input type="password" id="password" value="" required>


           <button type="submit" id="submit">Login</button>
       </form>
    
            <p>new here?</p>
            <a href="create.html">Sign-Up</a>
           
    

   </div>
</body>


</html>
