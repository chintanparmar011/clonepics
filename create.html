<!DOCTYPE html>
<html>



<head>
    <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
            
      
      
      body {
        font-family: 'Montserrat', sans-serif;
      }  
            * {
              padding: 0;
              margin: 0;
              box-sizing: border-box;
            }
        
            html,
            body {
              height: 100%;
              background-color: rgb(255, 255, 255);
              font-family: Arial, sans-serif;
            }
        
            .navigation {
              display: flex;
              justify-content: space-between;
              align-items: center;
              width: 100%;
              height: 50px;
              background-color: rgb(107, 200, 211);
              color: aliceblue;
              padding: 0 10px;
            }
        
            .navigation div {
              display: flex;
              align-items: center;
              gap: 10px;
            }
        
            .navigation img {
              width: 50px;
              border-radius: 50%;
            }
        
            .nav a {
              text-decoration: none;
              color: black;
              font-size: 17px;
              padding: 8px 12px;
              border-radius: 5px;
              transition: all 0.3s ease;
            }
        
            .nav a:hover {
              text-decoration: underline;
              color: rgb(21, 26, 31);
            }
        
            .login {
              background-color: rgb(152, 245, 245);
              border: 1px solid rgb(107, 99, 99);
              border-radius: 7px;
              box-shadow: 4px 4px rgb(133, 132, 132);
              margin: 50px auto 60px auto;
              padding: 30px 20px;
              max-width: 450px;
              width: 90%;
            }
        
            .login h2 {
              text-align: center;
              font-size: 28px;
              margin-bottom: 25px;
            }
        
            .form {
              display: flex;
              flex-direction: column;
              gap: 15px;
            }
        
            .form label {
              font-weight: bold;
              margin-bottom: 5px;
            }
        
            .form input {
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 8px;
            }
        
            .form button {
              margin-top: 20px;
              padding: 10px;
              border: none;
              border-radius: 7px;
              background-color: rgb(107, 200, 211);
              color: white;
              font-size: 16px;
              cursor: pointer;
              transition: 0.3s ease;
            }
        
            .form button:hover {
              transform: scale(1.05);
              background-color: rgb(54, 48, 48);
            }
        
            @media (max-width: 768px) {
              .login {
                margin: 30px 15px 60px 15px;
                padding: 25px 15px;
              }
        
              .form button {
                width: 100%;
              }
            }
          </style>
</head>


<body>
    <header class="navigation">

        <div class="title">
            <img src="/photos/wallhaven-gjw8le_1280x1024 copy.png">
            <h1 >Clonepics</h1> 

        </div>               
        <nav class="nav">
            <a href="index.html" class="login-btn">Home</a>
        </nav>
    </header>
    
   <div class="login">
       <h2>Sign-up</h2>
       <form class="form" method="get" action="login.html">
          <a>Username: </a><br>     <input type="text" id="uname" value="" required><br>
          <a>E-mail:</a>   <br>    <input type="email" id="uname" value="" required><br>
           <a>Password:</a><br>    <input type="password" id="password" value=""required ><br>
          <a>Conform Your Password: </a>  <br>  <input type="password" id="password" value="" required><br>


           <button type="submit" id="submit">Sign-up</button>
       </form>

   </div>
</body>


</html>
