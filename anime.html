   <style>
                @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
      
      
      body {
        font-family: 'Montserrat', sans-serif;
      }  

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background-color: rgb(255, 255, 255);
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 50px;
    background-color: rgb(107, 200, 211);
    color: aliceblue;
    padding: 1px 10px;
}

.navigation div {
    display: flex;
    align-items: center;
    gap: 10px;
}

.navigation div img {
    width: 50px;
    border-radius: 50%;
}

.nav a {
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    text-decoration: none;
    color: black;
    font-size: 17px;
    padding: 8px 12px;
    border-radius: 5px;
    transition: all 0.5s ease;
}

.nav a:hover {
    text-decoration: underline;
    font-size: 18px;
}

.items {
    margin-top: 7rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 0 20px;
    margin-bottom: 7rem;
  }
  
  .item {
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: auto;
    text-align: center;
  }
  
  .item > img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 7px;
    transition: transform 0.5s;
  }
  
  .item > img:hover {
    transform: scale(1.05);
  }
  

.item > a {
  display: block;
  text-align: center;
  color: #18191a;
  padding: 7px 8px;
  margin: 10px auto;
  font-size: 13px;
  text-decoration: none;
  border-radius: 5px;
  background-color: rgb(99, 204, 243);
  transition: all 0.3s ease;
  width: fit-content;
}

.item > a:hover {
  background-image: linear-gradient(#213132, #0e0e0d);
  color: #f2f4fa;
  font-size: 15px;
}


@media (max-width: 1024px) {
    .items {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 768px) {
    
    .items {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
  
    .item > img {
        padding-top:20px;
      max-height: 300px;
    }
  
}

@media (max-width: 480px) {
    .items {
        grid-template-columns: 1fr;
    }
}
